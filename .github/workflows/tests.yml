name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The core package is stdlib-only, so the test suite needs nothing but
      # pytest. Keeping it that way is deliberate: the inspection logic must be
      # testable without a camera, a GPU or a display.
      - run: pip install pytest
      - run: python -m pytest tests -q
      - run: python -m compileall -q label_detections main.py
