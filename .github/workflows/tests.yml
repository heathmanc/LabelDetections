name: Tests

# Fast feedback on every push and PR. Deliberately separate from the Windows
# release build: that one takes ~30 minutes to package a multi-GB bundle, which
# is far too slow to learn that the UI cannot even start.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          # Qt needs these even under the offscreen platform plugin.
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # headless OpenCV: the app only uses cv2 for image processing, never
          # its GUI functions, and the headless wheel avoids pulling in GTK.
          pip install pytest "PySide6>=6.6" "opencv-python-headless>=4.8" "numpy>=1.24" "PyYAML>=6.0"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # The core suite needs nothing but stdlib; the UI tests build the real
          # MainWindow offscreen, which catches the Qt errors that only surface
          # at call time -- wrong argument types, bad enums, missing attributes --
          # and that no static check or byte-compile can see.
          python -m pytest tests -q

      - name: Byte-compile
        run: python -m compileall -q label_detections main.py
