name: Build Windows Release

# Produces a zipped, self-contained Windows build.
#  - push a tag like v0.9.65  -> builds and publishes a GitHub Release
#  - run manually             -> builds and uploads an artifact you can download
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bundle_ml:
        description: "Bundle torch/ultralytics into the exe (much larger, ~2.5GB)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # opencv-python-headless conflicts with the GUI build; install the
          # normal wheel. pypylon ships Windows wheels for the Basler SDK.
          pip install PySide6>=6.6 opencv-python>=4.8 numpy>=1.24 PyYAML>=6.0 pypylon>=3.0
          pip install "pyinstaller~=6.6"

      - name: Install ML stack (full build only)
        if: inputs.bundle_ml
        shell: pwsh
        run: pip install "ultralytics>=8.3.0"

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path bung_labeler/version.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "App version: $v"

      - name: Build with PyInstaller
        shell: pwsh
        env:
          BUNGVISION_BUNDLE_ML: ${{ inputs.bundle_ml && '1' || '' }}
        run: pyinstaller BungVisionLabelStudio.spec --noconfirm

      - name: Stage seed data next to the exe
        shell: pwsh
        run: |
          # storage._app_root() resolves user data beside the .exe when frozen,
          # so the starter recipes/class config must ship there -- not inside _internal.
          $dest = "dist/BungVisionLabelStudio"
          New-Item -ItemType Directory -Force -Path "$dest/data/recipes" | Out-Null
          Copy-Item "data/class_config.json" "$dest/data/" -Force
          Copy-Item "data/recipes/*.json" "$dest/data/recipes/" -Force
          Copy-Item "README.md" "$dest/" -Force

      - name: Smoke test (exe launches and exits cleanly)
        shell: pwsh
        run: |
          # Qt offscreen platform lets the GUI start headlessly on the runner.
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist/BungVisionLabelStudio/BungVisionLabelStudio.exe" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited -and $p.ExitCode -ne 0) {
            Write-Error "App exited early with code $($p.ExitCode) -- build is broken."
            exit 1
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Smoke test passed: app started without crashing."

      - name: Zip release
        shell: pwsh
        run: |
          $name = "BungVisionLabelStudio-v${{ steps.ver.outputs.version }}-windows-x64"
          Compress-Archive -Path "dist/BungVisionLabelStudio/*" -DestinationPath "$name.zip"
          "zip=$name.zip" >> $env:GITHUB_OUTPUT
        id: zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BungVisionLabelStudio-windows-x64
          path: ${{ steps.zip.outputs.zip }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.zip }}
          generate_release_notes: true
          body: |
            ## BungVision Label Studio v${{ steps.ver.outputs.version }} — Windows x64

            **Install:** download the zip, extract it anywhere you have write access
            (Desktop, Documents — *not* `C:\Program Files`), and run
            `BungVisionLabelStudio.exe`.

            Your captures, labels, and exports are written to the `data\` folder
            beside the exe, so they survive upgrades — copy that folder forward
            when you update.

            ### Model features need one extra step
            This build excludes the ~2.5 GB PyTorch stack. Labeling, capture,
            review, dataset health, and YOLO export all work out of the box.
            For **Auto-label, Pre-label & Review, Model Test, and Training**,
            install Python 3.11 and run:

            ```
            pip install ultralytics
            ```

            Then set the `yolo` executable path in the Train tab if it is not on PATH.
